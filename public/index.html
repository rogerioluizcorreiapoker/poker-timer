<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poker Semipresencial</title>
<link rel="stylesheet" href="/shared/common.css" />
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .box { max-width: 520px; width: 100%; text-align: center; }
  h1 { color: var(--orange); font-size: 34px; margin: 0 0 6px; letter-spacing: .02em; }
  p { color: var(--muted); margin: 0 0 28px; }
  a.big { display: block; background: var(--panel); border: 1px solid #333; border-radius: 14px; padding: 20px; margin: 12px 0; color: #fff; text-decoration: none; font-size: 20px; font-weight: 700; }
  a.big small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; margin-top: 6px; }
  a.big:hover { border-color: var(--orange); }
  form { display: flex; gap: 8px; margin-top: 18px; }
  input { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #111; color: #fff; text-transform: uppercase; font-size: 20px; text-align: center; letter-spacing: .3em; }
  button { background: var(--orange); color: #000; font-weight: 800; padding: 0 20px; }
</style>
</head>
<body>
<div class="box">
  <h1>POKER SEMIPRESENCIAL</h1>
  <p>A TV é o dealer. As cartas chegam no celular.</p>
  <a class="big" href="/tv">📺 Abrir na TV <small>Cria uma mesa nova e mostra o QR code para entrar</small></a>
  <a class="big" href="/timer">⏱ Só o timer de blinds <small>A versão original, sem jogo</small></a>
  <form onsubmit="event.preventDefault(); location.href='/j/'+this.code.value.trim().toUpperCase()">
    <input name="code" maxlength="4" placeholder="CÓDIGO" required />
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
