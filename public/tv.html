<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poker · Mesa</title>
<link rel="stylesheet" href="/shared/common.css" />
<style>
  html, body { height: 100%; overflow: hidden; font-family: 'Arial Black', Impact, 'Segoe UI', sans-serif; }
  #app { display: grid; grid-template-rows: 11vh 1fr 12vh; height: 100vh; }

  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 3vw; }
  .hl { font-size: 2.2vw; color: var(--orange); letter-spacing: .03em; text-shadow: 2px 2px 0 #351000; }
  .hv { font-size: 4vw; color: var(--green); line-height: 1; text-shadow: 2px 2px 0 #073800; }
  .clock { text-align: center; }
  .clock .hv { font-size: 5.5vw; color: #fff; text-shadow: 3px 3px 0 #222; }
  .clock .hl { color: var(--cream); text-shadow: 3px 3px 0 #b0005b; }
  .right { text-align: right; }

  main { position: relative; }
  .felt {
    position: absolute; inset: 9vh 14vw; border-radius: 50% / 50%;
    background: radial-gradient(ellipse at center, #0f6b3a 0%, var(--felt) 60%, var(--felt-edge) 100%);
    border: 1.2vw solid #3b2a1a; box-shadow: inset 0 0 60px rgba(0,0,0,.6), 0 0 40px rgba(0,0,0,.8);
  }
  .center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; width: 60vw; }
  .community { display: flex; gap: .8vw; justify-content: center; --card-w: 6.2vw; min-height: calc(6.2vw * 1.4); }
  .pot { margin-top: 1.4vh; font-size: 2.6vw; color: var(--cream); text-shadow: 2px 2px 0 #000; }
  .pot b { color: var(--green); }
  .pots { font-size: 1.4vw; color: #cfd; font-family: 'Segoe UI', sans-serif; font-weight: normal; }

  .seat {
    position: absolute; width: 13vw; transform: translate(-50%, -50%);
    background: rgba(10,10,10,.85); border: .25vw solid #333; border-radius: 1vw; padding: .6vh .6vw;
    text-align: center; font-family: 'Segoe UI', Roboto, sans-serif; transition: border-color .2s, box-shadow .2s;
  }
  .seat.current { border-color: var(--orange); box-shadow: 0 0 25px var(--orange); }
  .seat.folded { opacity: .45; }
  .seat.out { opacity: .3; }
  .seat.winner { border-color: var(--green); box-shadow: 0 0 30px var(--green); }
  .seat .name { font-weight: 800; font-size: 1.5vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seat .name .dot { display: inline-block; width: .7vw; height: .7vw; border-radius: 50%; background: var(--red); margin-right: .3vw; vertical-align: middle; }
  .seat .name .dot.on { background: var(--green); }
  .seat .stack { font-size: 1.7vw; color: var(--green); font-weight: 900; }
  .seat .cards { display: flex; gap: .3vw; justify-content: center; margin: .5vh 0; --card-w: 3.2vw; min-height: calc(3.2vw * 1.4); }
  .seat .status { font-size: 1.1vw; color: var(--cream); min-height: 1.4vw; text-transform: uppercase; letter-spacing: .05em; }
  .seat .status.allin { color: var(--red); font-weight: 900; }
  .seat .timer { height: .6vh; background: #333; border-radius: 3px; overflow: hidden; margin-top: .4vh; }
  .seat .timer i { display: block; height: 100%; width: 100%; background: var(--orange); }
  .seat .timer i.low { background: var(--red); }
  .bet {
    position: absolute; transform: translate(-50%, -50%); background: #ffd34d; color: #000; font-weight: 900;
    font-size: 1.3vw; padding: .3vh .8vw; border-radius: 2vw; border: .2vw solid #b8860b; font-family: 'Segoe UI', sans-serif;
    box-shadow: 0 2px 6px rgba(0,0,0,.7); white-space: nowrap;
  }
  .seat .dealer {
    position: absolute; top: -1vw; right: -1vw; width: 2.2vw; height: 2.2vw; border-radius: 50%;
    background: #fff; color: #000; font-weight: 900; font-size: 1.3vw; display: flex; align-items: center; justify-content: center; border: .2vw solid #999;
  }

  footer { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 0 3vw; gap: 2vw; }
  .msg { font-size: 2.2vw; color: var(--cream); text-shadow: 2px 2px 0 #000; }
  .msg.big { font-size: 3.4vw; color: var(--green); }
  .join { display: flex; align-items: center; gap: 1vw; font-family: 'Segoe UI', sans-serif; }
  .join img { height: 10vh; border-radius: .5vw; background: #fff; }
  .join .code { font-size: 3.2vw; color: var(--orange); font-weight: 900; letter-spacing: .15em; }
  .join .url { font-size: 1.2vw; color: var(--muted); }

  /* Lobby */
  .lobby { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4vw; font-family: 'Segoe UI', sans-serif; }
  .lobby img { height: 50vh; border-radius: 1vw; background: #fff; padding: 1vw; }
  .lobby .info { max-width: 40vw; }
  .lobby h2 { color: var(--orange); font-size: 3vw; margin: 0 0 1vh; }
  .lobby .code { font-size: 7vw; color: var(--green); font-weight: 900; letter-spacing: .15em; line-height: 1; }
  .lobby .url { color: var(--muted); font-size: 1.6vw; margin-bottom: 2vh; }
  .lobby ul { list-style: none; padding: 0; margin: 0; columns: 2; font-size: 1.8vw; }
  .lobby li::before { content: '● '; color: var(--green); }
  .lobby li.host::after { content: ' (anfitrião)'; color: var(--muted); font-size: .7em; }
  .lobby p { color: var(--muted); font-size: 1.4vw; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9vw; color: var(--red); text-shadow: 4px 4px 0 #000; background: rgba(0,0,0,.6); letter-spacing: .1em; }
  .hint { position: fixed; right: 1vw; top: .5vh; font-family: 'Segoe UI', sans-serif; font-size: 1vw; color: #555; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="hl">Blinds</div>
      <div class="hv" id="blinds">—</div>
    </div>
    <div class="clock">
      <div class="hl" id="levelName">Aguardando</div>
      <div class="hv" id="levelTimer">--:--</div>
    </div>
    <div class="right">
      <div class="hl" id="nextLabel">Próximo</div>
      <div class="hv" id="nextBlinds">—</div>
    </div>
  </header>
  <main id="main">
    <div class="felt"></div>
    <div class="center">
      <div class="community" id="community"></div>
      <div class="pot">POTE <b id="pot">0</b> <div class="pots" id="pots"></div></div>
    </div>
    <div id="seats"></div>
    <div class="lobby hidden" id="lobby">
      <img id="lobbyQr" alt="QR code" />
      <div class="info">
        <h2>Entre pelo celular</h2>
        <div class="code" id="lobbyCode">----</div>
        <div class="url" id="lobbyUrl"></div>
        <ul id="lobbyPlayers"></ul>
        <p id="lobbyHint">Aponte a câmera do celular para o QR code. O primeiro a entrar é o anfitrião e inicia o jogo pelo celular.</p>
      </div>
    </div>
    <div class="overlay hidden" id="overlay"></div>
  </main>
  <footer>
    <div class="msg" id="msg"></div>
    <div class="join">
      <div>
        <div class="code" id="footCode">----</div>
        <div class="url" id="footUrl"></div>
      </div>
      <img id="footQr" alt="QR code" />
    </div>
  </footer>
</div>
<div class="hint">F = tela cheia</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
import { cardEl, fmt, fmtShort, fmtMMSS, ACTION_PT, toast, syncClock, serverNow, blindsText } from '/shared/common.js';

const $ = (id) => document.getElementById(id);
const socket = io();
let snap = null;
let code = new URLSearchParams(location.search).get('t');
let publicUrl = null;
fetch('/api/info').then((r) => r.json()).then((i) => { publicUrl = i.publicUrl; if (snap) render(); }).catch(() => {});

socket.on('connect', () => {
  if (code) {
    socket.emit('tv:watch', { code }, (res) => {
      if (!res.ok) {
        toast(res.error + ' — criando mesa nova', 'error');
        create();
      }
    });
  } else create();
});

function create() {
  socket.emit('tv:create', {}, (res) => {
    if (!res.ok) return toast(res.error, 'error');
    code = res.code;
    history.replaceState(null, '', `/tv?t=${code}`);
  });
}

socket.on('state', (s) => {
  snap = s;
  syncClock(s.serverNow);
  render();
});
socket.on('toast', (t) => toast(t.text, t.kind));

function joinUrl() {
  return `${publicUrl || location.origin}/j/${snap.code}`;
}

function render() {
  const t = snap.table;
  const url = joinUrl();
  const qr = `/api/qr?url=${encodeURIComponent(url)}`;
  for (const id of ['lobbyCode', 'footCode']) $(id).textContent = snap.code;
  for (const id of ['lobbyUrl', 'footUrl']) $(id).textContent = url.replace(/^https?:\/\//, '');
  if ($('lobbyQr').dataset.url !== url) {
    $('lobbyQr').src = qr; $('footQr').src = qr; $('lobbyQr').dataset.url = url;
  }

  // cabeçalho
  $('blinds').textContent = blindsText(t.blinds);
  const c = snap.clock;
  if (c) {
    if (c.item.type === 'break') {
      $('levelName').textContent = 'INTERVALO';
    } else {
      $('levelName').textContent = `Nível ${c.item.level}`;
    }
    $('nextLabel').textContent = 'Próximo';
    $('nextBlinds').textContent = c.next ? `${fmtShort(c.next.sb)}/${fmtShort(c.next.bb)}` : 'Fim';
  } else {
    $('levelName').textContent = 'Cash game';
    $('levelTimer').textContent = snap.status === 'running' ? `Mão ${t.handNumber}` : '--:--';
    $('nextLabel').textContent = 'Jogadores';
    $('nextBlinds').textContent = String(t.players.filter((p) => !p.sittingOut).length);
  }

  // lobby x mesa
  const lobby = snap.status === 'lobby';
  $('lobby').classList.toggle('hidden', !lobby);
  $('seats').classList.toggle('hidden', lobby);
  document.querySelector('.felt').classList.toggle('hidden', lobby);
  document.querySelector('.center').classList.toggle('hidden', lobby);
  if (lobby) {
    $('lobbyPlayers').innerHTML = t.players
      .map((p) => `<li class="${p.id === snap.hostId ? 'host' : ''}">${esc(p.name)}</li>`)
      .join('');
    const localhost = !publicUrl && /^(localhost|127\.)/.test(location.hostname);
    $('msg').textContent = localhost
      ? 'Abra a TV pelo IP do computador (veja o terminal), senão o QR não abre no celular.'
      : t.players.length < 2 ? 'Aguardando pelo menos 2 jogadores…' : 'Pronto. O anfitrião inicia pelo celular.';
    $('overlay').classList.add('hidden');
    return;
  }

  // board
  const community = $('community');
  community.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const card = t.community[i];
    community.appendChild(card ? cardEl(card) : cardEl(null, { placeholder: true }));
  }
  $('pot').textContent = fmt(t.pot);
  const anyAllIn = t.players.some((p) => p.allIn);
  $('pots').textContent = anyAllIn && t.pots.length > 1 ? 'Potes: ' + t.pots.map(fmt).join(' · ') : '';

  renderSeats(t);

  // overlay e mensagens
  const ov = $('overlay');
  if (snap.status === 'paused') { ov.textContent = 'PAUSADO'; ov.classList.remove('hidden'); }
  else if (c && c.inBreak && !inProgress(t)) { ov.textContent = 'INTERVALO'; ov.classList.remove('hidden'); }
  else ov.classList.add('hidden');

  const msg = $('msg');
  msg.classList.remove('big');
  if (snap.message) { msg.textContent = snap.message; msg.classList.add('big'); }
  else if (t.stage === 'finished' && t.lastResult) {
    const r = t.lastResult;
    const names = r.winners.map((w) => `${nameOf(t, w.playerId)} (+${fmt(w.amount)})`).join(', ');
    const hand = r.winners[0]?.handName;
    msg.textContent = r.type === 'fold' ? `${names} leva o pote` : `${names} vence com ${hand}`;
    msg.classList.add('big');
  } else if (inProgress(t)) {
    const cur = t.players.find((p) => p.id === t.currentPlayerId);
    msg.textContent = cur ? `Vez de ${cur.name}` : '';
  } else if (snap.status === 'ended') {
    msg.textContent = 'Torneio encerrado';
  } else {
    msg.textContent = 'Aguardando próxima mão…';
  }
}

function inProgress(t) {
  return ['preflop', 'flop', 'turn', 'river'].includes(t.stage);
}
function nameOf(t, id) {
  return t.players.find((p) => p.id === id)?.name ?? '?';
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function seatPositions(n) {
  // Distribui em elipse, começando embaixo no centro e indo em sentido horário.
  const out = [];
  for (let i = 0; i < n; i++) {
    const angle = Math.PI / 2 + (i * 2 * Math.PI) / n;
    out.push({ x: 50 + 42 * Math.cos(angle), y: 50 + 41 * Math.sin(angle) });
  }
  return out;
}

function renderSeats(t) {
  const wrap = $('seats');
  wrap.innerHTML = '';
  const players = t.players;
  const pos = seatPositions(players.length);
  const winners = new Set((t.stage === 'finished' && t.lastResult?.winners.map((w) => w.playerId)) || []);
  players.forEach((p, i) => {
    const { x, y } = pos[i];
    const el = document.createElement('div');
    el.className = 'seat';
    if (p.id === t.currentPlayerId) el.classList.add('current');
    if (p.folded) el.classList.add('folded');
    if (p.sittingOut || (!p.inHand && inProgress(t))) el.classList.add('out');
    if (winners.has(p.id)) el.classList.add('winner');
    el.style.left = x + '%';
    el.style.top = y + '%';

    const showCards = p.inHand && !p.folded;
    const faces = p.cards;
    const cardsHtml = document.createElement('div');
    cardsHtml.className = 'cards';
    if (showCards) {
      if (faces) faces.forEach((c) => cardsHtml.appendChild(cardEl(c)));
      else { cardsHtml.appendChild(cardEl(null, { hidden: true })); cardsHtml.appendChild(cardEl(null, { hidden: true })); }
    }

    let status = '';
    let statusClass = '';
    if (p.sittingOut) status = 'Fora';
    else if (p.allIn) { status = 'ALL-IN'; statusClass = 'allin'; }
    else if (p.lastAction && inProgress(t)) status = ACTION_PT[p.lastAction] ?? p.lastAction;
    else if (t.stage === 'finished' && t.lastResult?.revealed?.[p.id]) status = t.lastResult.revealed[p.id].handName;
    if (p.stack === 0 && !p.inHand && !p.allIn) status = 'Eliminado';

    el.innerHTML = `
      <div class="name"><span class="dot ${p.connected ? 'on' : ''}"></span>${esc(p.name)}</div>
      <div class="stack">${fmt(p.stack)}</div>
    `;
    el.appendChild(cardsHtml);
    const st = document.createElement('div');
    st.className = 'status ' + statusClass;
    st.textContent = status;
    el.appendChild(st);
    if (p.id === t.currentPlayerId) {
      const bar = document.createElement('div');
      bar.className = 'timer';
      bar.innerHTML = '<i></i>';
      el.appendChild(bar);
    }
    wrap.appendChild(el);

    // ficha de aposta e botão do dealer, entre o assento e o centro
    const toward = (k) => ({ x: x + (50 - x) * k, y: y + (50 - y) * k });
    if (p.bet > 0) {
      const b = document.createElement('div');
      b.className = 'bet';
      const q = toward(0.32);
      b.style.left = q.x + '%';
      b.style.top = q.y + '%';
      b.textContent = fmt(p.bet);
      wrap.appendChild(b);
    }
    if (p.seat === t.dealerSeat && (inProgress(t) || t.stage === 'finished')) {
      const d = document.createElement('div');
      d.className = 'dealer';
      d.textContent = 'D';
      el.appendChild(d);
    }
  });
}

// Contagens regressivas (relógio de nível e timer de ação) rodam no cliente.
setInterval(() => {
  if (!snap) return;
  const c = snap.clock;
  if (c) {
    // quanto falta no nível = o que o snapshot dizia menos o tempo passado desde então
    const rem = c.running ? c.remaining - (serverNow() - snap.serverNow) / 1000 : c.remaining;
    $('levelTimer').textContent = c.done ? 'FIM' : fmtMMSS(rem);
  }
  const bar = document.querySelector('.seat.current .timer i');
  if (bar && snap.actionDeadline) {
    const left = (snap.actionDeadline - serverNow()) / 1000;
    const pct = Math.max(0, Math.min(100, (left / snap.actionSeconds) * 100));
    bar.style.width = pct + '%';
    bar.classList.toggle('low', left < 8);
  }
}, 200);

document.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'f') document.documentElement.requestFullscreen?.();
});
</script>
</body>
</html>
